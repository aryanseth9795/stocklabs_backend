# Common upstream request headers.
#
# This is an include rather than an http-level block on purpose. nginx's
# proxy_set_header directives are inherited from the enclosing level ONLY IF the
# current level defines none of its own. The moment a location adds a single
# `proxy_set_header Upgrade ...` (as /socket.io/ must), every inherited header
# is dropped — Host, X-Forwarded-For, all of it — and the app starts seeing the
# proxy's IP as the client IP with no error anywhere. Including this file
# explicitly in each location makes that impossible.
#
# The app runs `app.set("trust proxy", 1)`, so it reads X-Forwarded-For for
# req.ip. nginx is the outermost hop here, so $proxy_add_x_forwarded_for is
# authoritative. If a CDN is ever put in front of this box, that assumption
# breaks and rate limiting starts keying on the CDN's IPs.

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;
