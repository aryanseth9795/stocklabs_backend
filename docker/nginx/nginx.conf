# StockLabs edge proxy.
#
# Mounted at /etc/nginx/nginx.conf (read-only) by docker-compose.prod.yml.
# Companion snippet: /etc/nginx/snippets/proxy-common.conf.
#
# Responsibilities: TLS termination, ACME webroot, rate limiting on the
# unauthenticated auth/OTP routes, WebSocket upgrade, SSE passthrough, and
# spreading load over however many `api` replicas exist right now.

user  nginx;
worker_processes  auto;

# The official image symlinks these to /dev/stderr and /dev/stdout, so logs land
# in the json-file driver (which is size-capped in compose).
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time '
                      'ua="$upstream_addr" us=$upstream_status '
                      'urt=$upstream_response_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off;

    keepalive_timeout   65s;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout        30s;
    client_max_body_size 1m;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_min_length   1024;
    gzip_types        application/json application/javascript text/css text/plain text/xml;

    # -----------------------------------------------------------------------
    # WebSocket upgrade plumbing.
    #
    # HTTP/1.1 "Connection" is a hop-by-hop header, so it must be regenerated
    # per request: "upgrade" when the client asked to upgrade, "close"
    # otherwise. A hardcoded `Connection upgrade` breaks plain HTTP requests;
    # omitting it entirely breaks WebSockets.
    # -----------------------------------------------------------------------
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # -----------------------------------------------------------------------
    # Service discovery.
    #
    # Open-source nginx cannot re-resolve names inside an `upstream {}` block at
    # runtime (`server ... resolve` is NGINX Plus only): a static
    # `upstream { server api:4000; }` caches the first replica's IP at startup
    # and never learns about the ones `--scale` adds afterwards.
    #
    # The workaround is a `resolver` (Docker's embedded DNS at 127.0.0.11) plus
    # a VARIABLE in proxy_pass, which forces a fresh lookup per request, honours
    # the TTL below, and round-robins over every A record the service alias
    # returns. Scaling then needs zero nginx involvement.
    #
    # What this gives up, honestly: no least_conn/ip_hash, no passive health
    # checks, no upstream keepalive pool, and a deregistration window of up to
    # `valid=` after a container exits, during which a request may be sent to a
    # dead address. valid=1s keeps that to about one second per replica per
    # deploy. That window is inherent to DNS-based discovery on OSS nginx and
    # cannot be fully closed; docker/scripts/rolling-restart.sh sleeps past it
    # between replicas so it is never open on more than one at a time.
    #
    # ipv6=off because the compose networks are IPv4-only; without it every
    # lookup also asks for an AAAA record and logs a NOERROR-empty response.
    # -----------------------------------------------------------------------
    resolver         127.0.0.11 valid=1s ipv6=off;
    resolver_timeout 5s;

    # -----------------------------------------------------------------------
    # Retry policy.
    #
    # NOT `non_idempotent`, and NOT `http_503`. Every zero-downtime nginx
    # tutorial recommends adding both; on this application both are bugs.
    #
    #   non_idempotent — would let nginx replay POSTs. The POSTs here are
    #     /api/v1/order and the short open/close routes. Replaying one produces
    #     a DUPLICATE ORDER and a duplicate balance debit, from a deploy blip
    #     the user never sees. A failed order the user can retry is strictly
    #     better than a silently doubled one.
    #
    #   http_503 — the 503s this app emits are business responses, not
    #     transport failures: "No live price available" from the commodity and
    #     short controllers. The price feed is shared through Redis, so every
    #     peer replica returns exactly the same 503. Retrying is guaranteed
    #     useless, multiplies load during a feed outage, and masks the outage in
    #     the metrics.
    #
    # A cold replica is handled at the app layer instead: the app gates
    # server.listen() on Redis hydration, so "in DNS but not warm" surfaces as
    # ECONNREFUSED — which IS in `error` and is transparently retried onto a
    # warm peer, safely, because no bytes were ever sent.
    # -----------------------------------------------------------------------
    proxy_next_upstream         error timeout http_502 http_504;
    proxy_next_upstream_tries   2;
    proxy_next_upstream_timeout 10s;

    proxy_http_version  1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;
    proxy_send_timeout    60s;

    # -----------------------------------------------------------------------
    # Rate limiting.
    #
    # Keyed on $binary_remote_addr, which is the true client address because
    # nginx is the outermost hop. 10 MB of zone holds roughly 160k addresses.
    # -----------------------------------------------------------------------

    # /api/v1/login, /api/v1/signup — credential stuffing and account spam.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    # /api/v1/forget and /api/v1/forget/verify — the sharp one. `forget` is an
    # unauthenticated route that SENDS EMAIL through a metered third party, and
    # `forget/verify` is where OTPs are guessed. Its only other throttle is the
    # per-user OTP cooldown in Redis, which does not stop an attacker cycling
    # through addresses.
    limit_req_zone $binary_remote_addr zone=otp:10m rate=3r/m;

    # Everything else: 2 r/s sustained. Generous for a UI whose realtime data
    # arrives over WebSocket rather than polling.
    limit_req_zone $binary_remote_addr zone=api:10m rate=120r/m;

    limit_req_status    429;
    limit_req_log_level warn;

    # =======================================================================
    # :80 — ACME webroot + redirect. Nothing is proxied to the app here.
    # =======================================================================
    server {
        listen      80;
        listen      [::]:80;
        server_name api.aryantechie.in;

        # Let's Encrypt http-01 challenge. Shared volume with the certbot
        # service. `^~` so it beats the regex locations below and is never
        # redirected to https (the challenge must answer on plain :80).
        location ^~ /.well-known/acme-challenge/ {
            root         /var/www/certbot;
            default_type "text/plain";
            access_log   off;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =======================================================================
    # :443 — the real thing.
    # =======================================================================
    server {
        listen      443 ssl;
        listen      [::]:443 ssl;
        http2       on;
        server_name api.aryantechie.in;

        ssl_certificate     /etc/letsencrypt/live/api.aryantechie.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.aryantechie.in/privkey.pem;

        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       1d;
        ssl_session_tickets       off;

        # NODE_ENV=production makes the app issue cookies with
        # secure:true, sameSite:"none" — those are silently dropped by browsers
        # over plain http, so TLS terminating here is a hard requirement, not a
        # nicety.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

        # ------------------------------------------------------------------
        # The backend address. Assigned to a variable so proxy_pass re-resolves
        # per request (see the resolver comment above).
        #
        # FOOTGUN: with a variable in proxy_pass, nginx does NOT apply the
        # location's URI substitution. It must therefore have NO path component
        # — not even a bare trailing slash. `proxy_pass http://$api_backend/;`
        # would rewrite every request path to "/" and the entire API would 404.
        # ------------------------------------------------------------------
        set $api_backend "api:4000";

        # ==================================================================
        # NO STICKY SESSIONS — deliberate, and safe only under one condition.
        #
        # Requests from a single client are spread across replicas by DNS
        # round-robin with no affinity whatsoever. That is fine here because:
        #
        #   1. BOTH clients connect with transports: ["websocket"] (web:
        #      Frontend/src/lib/socket.ts, mobile: App/src/context/
        #      SocketContext.tsx). A websocket-only client performs ONE HTTP
        #      request that immediately upgrades, so there is no multi-request
        #      handshake that could land on a different replica.
        #   2. Auth is stateless (JWT in a cookie) — any replica can verify it.
        #   3. The password-reset OTP store and the Socket.IO user->socket
        #      registry both live in Redis, not in process memory.
        #   4. Socket.IO runs the Redis adapter, so a broadcast or a forced
        #      disconnect reaches a socket on any replica.
        #
        # WHAT BREAKS IF LONG-POLLING IS EVER RE-ENABLED (i.e. if a client drops
        # to transports: ["polling", "websocket"], or a corporate proxy forces
        # the fallback): Engine.IO's polling handshake is several HTTP requests
        # carrying an `sid` that only the originating replica knows. Without
        # affinity, request 2 lands on a different replica, which answers
        # {"code":1,"message":"Session ID unknown"}, and the client reconnects
        # forever. It fails 100% of the time at 2+ replicas and 0% at 1 replica,
        # so it will pass every single-replica test and break in production.
        #
        # If polling ever has to be supported, ip_hash is NOT the fix here: it
        # is incompatible with the variable-proxy_pass resolver approach, and it
        # would pin every user behind one corporate NAT to a single replica.
        # The fix is to move to a proxy that can do cookie-based affinity
        # (Traefik, or a templated upstream block regenerated on scale).
        # ==================================================================

        # ------------------------------------------------------------------
        # Socket.IO — WebSocket upgrade.
        # `^~` so this prefix wins over the regex locations further down.
        # ------------------------------------------------------------------
        location ^~ /socket.io/ {
            include /etc/nginx/snippets/proxy-common.conf;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_pass http://$api_backend;

            # A websocket is idle whenever the market is quiet; the default 60 s
            # read timeout would tear down healthy connections all day.
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;

            # Buffering an upgraded connection is meaningless and adds latency
            # to every tick.
            proxy_buffering off;

            # NO limit_req HERE, ON PURPOSE.
            # Every deploy or replica restart produces a synchronised reconnect
            # storm: every connected client retries within a couple of seconds.
            # Rate-limiting that turns one routine restart into a self-inflicted
            # outage where the clients that got 429'd back off and retry, which
            # extends the storm. The connection count is bounded by
            # worker_connections instead.
        }

        # ------------------------------------------------------------------
        # Commodity price stream (Server-Sent Events).
        #
        # Exact match (`=`) so it is decided before any regex location and can
        # never be captured by the general rate-limited `/` block.
        #
        # The app already sets X-Accel-Buffering: no, but the proxy has to
        # cooperate on all four counts below or the stream is buffered into
        # silence and the client sees nothing for minutes at a time.
        # ------------------------------------------------------------------
        location = /api/v1/commodity/stream {
            include /etc/nginx/snippets/proxy-common.conf;

            # SSE is a plain HTTP/1.1 response, not an upgrade. The inherited
            # keepalive Connection header must be cleared explicitly.
            proxy_set_header Connection "";

            proxy_pass http://$api_backend;

            # Hold the response open: this connection is expected to live for
            # hours and emits an event every few seconds.
            proxy_read_timeout 24h;
            proxy_send_timeout 24h;

            # 1. do not accumulate the response before forwarding it
            proxy_buffering            off;
            proxy_cache                off;
            # 2. do not gzip: gzip buffers to fill a compression window, which
            #    delays every event until enough bytes have accrued
            gzip                       off;
            # 3. do not re-chunk: pass the app's framing through untouched
            chunked_transfer_encoding  off;

            # No limit_req: this is one long-lived request per client, and
            # 429-ing a reconnecting stream produces the same storm as above.
        }

        # ------------------------------------------------------------------
        # Auth endpoints — 10 requests/minute/IP.
        # ------------------------------------------------------------------
        location ~ ^/api/v1/(login|signup)$ {
            limit_req zone=auth burst=5 nodelay;

            include /etc/nginx/snippets/proxy-common.conf;
            proxy_pass http://$api_backend;
        }

        # ------------------------------------------------------------------
        # Password reset — 3 requests/minute/IP.
        # Covers both /api/v1/forget (sends an email) and /api/v1/forget/verify
        # (guesses an OTP).
        # ------------------------------------------------------------------
        location ~ ^/api/v1/forget(/verify)?$ {
            limit_req zone=otp burst=2 nodelay;

            include /etc/nginx/snippets/proxy-common.conf;
            proxy_pass http://$api_backend;
        }

        # ------------------------------------------------------------------
        # Health endpoints are NOT public.
        #
        # /readyz runs a Prisma `SELECT 1` and reports board age, symbol count,
        # socket counts and shutdown state. Exposed, it is an unauthenticated
        # database-liveness oracle and a free map of the fleet's internals.
        # Docker's healthcheck hits the container directly on 127.0.0.1:4000, so
        # nothing operational depends on this being reachable from outside.
        #
        # 404, not 403: 403 confirms the path exists.
        # ------------------------------------------------------------------
        location ~ ^/(healthz|readyz)$ {
            access_log off;
            return 404;
        }

        # ------------------------------------------------------------------
        # Everything else.
        # ------------------------------------------------------------------
        location / {
            limit_req zone=api burst=60 nodelay;

            include /etc/nginx/snippets/proxy-common.conf;
            proxy_pass http://$api_backend;
        }
    }
}
